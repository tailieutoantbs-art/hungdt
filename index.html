    <script>
        function toggleThemePicker(e) {
            e.stopPropagation();
            let m = document.getElementById('theme-picker-menu');
            if(m) m.classList.toggle('hidden');
        }
        function setTheme(main, dark, light) {
            localStorage.setItem('themeMain', main);
            localStorage.setItem('themeDark', dark);
            localStorage.setItem('themeLight', light);
            location.reload();
        }
        document.addEventListener('click', (e) => {
            let m = document.getElementById('theme-picker-menu');
            if(m && !m.classList.contains('hidden') && !e.target.closest('#theme-picker-menu')) {
                m.classList.add('hidden');
            }
        });
    </script>

    <script>
        // CONFIG & FIREBASE INIT (Moved to config.js)

        let state = {
            currentUser: null,
            authorizedEmails: [SUPER_ADMIN_EMAIL],
            allResultsData: []
        };
        let savedLinks = [];

        window.onload = async function() {
            try { 
                let d = await db.collection("GameData").doc("GlobalLinks").get(); 
                savedLinks = d.exists ? d.data().list : (JSON.parse(localStorage.getItem('tbs_links')) || []); 
            } catch(e) { savedLinks = JSON.parse(localStorage.getItem('tbs_links')) || []; }
            
            try { 
                let authDoc = await db.collection("GameData").doc("AuthorizedTeachers").get(); 
                if(authDoc.exists) state.authorizedEmails = authDoc.data().list; 
            } catch(e) {}

            renderHomeScreen();

            firebase.auth().onAuthStateChanged((user) => {
                state.currentUser = user;
                let userInfo = document.getElementById('user-info-display');
                if (user) {
                    if(userInfo) { document.getElementById('user-avatar').src = user.photoURL; document.getElementById('user-email').innerText = user.email; userInfo.classList.remove('hidden'); userInfo.classList.add('flex'); }
                } else {
                    if(userInfo) { userInfo.classList.add('hidden'); userInfo.classList.remove('flex'); }
                }
                renderHomeScreen(); // Refresh giao diện nút quản trị
            });
        };

        // showToast is moved to config.js

        async function loginWithGoogle() { 
            if (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                showToast("Đăng nhập Local (Bypass) thành công!");
                localStorage.setItem('devModeBypass', 'true');
                window.location.href = 'teacher.html';
                return;
            }
            try { await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); showToast("Đăng nhập thành công!"); } 
            catch(e) { showToast("Lỗi đăng nhập: " + e.message, true); } 
        }

        async function logoutGoogle() { 
            if (localStorage.getItem('devModeBypass') === 'true') {
                localStorage.removeItem('devModeBypass');
                showToast("Đã đăng xuất Local!");
                setTimeout(() => window.location.reload(), 500);
                return;
            }
            try { await firebase.auth().signOut(); showToast("Đã đăng xuất!"); } 
            catch(e) { showToast("Lỗi đăng xuất", true); } 
        }

        function navTo(screen) { 
            ['board', 'home', 'links', 'guide'].forEach(id => { 
                let navBtn = document.getElementById('nav-' + id); 
                if (navBtn) { if (screen === id) navBtn.classList.add('tab-active'); else navBtn.classList.remove('tab-active'); } 
            });
            if(screen === 'home') renderHomeScreen(); 
            else if(screen === 'board') renderBoard();
            else if(screen === 'links') renderLinks(); 
            else if(screen === 'guide') renderGuide();
        }

        // ======================= VIEW RENDERERS =======================
        function renderHomeScreen() {
            let isDev = (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && localStorage.getItem('devModeBypass') === 'true';
            let teacherBlock = (state.currentUser || isDev)
                ? `<button onclick="window.location.href='teacher.html'" class="w-full py-3 bg-main text-white rounded-xl font-black shadow-md hover:bg-mainDark transition">VÀO PHÂN HỆ GIÁO VIÊN</button>
                   <button onclick="logoutGoogle()" class="w-full mt-3 py-2 bg-slate-200 rounded-xl font-bold hover:bg-slate-300 transition text-sm">Đăng xuất</button>`
                : `<button onclick="loginWithGoogle()" class="w-full py-3 bg-white border border-slate-300 rounded-xl font-black shadow-md flex justify-center items-center gap-2 hover:bg-slate-50 transition"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"> ĐĂNG NHẬP (GIÁO VIÊN)</button>`;

            document.getElementById('app-content').innerHTML = `
                <div class="glass-panel p-8 md:p-12 rounded-3xl w-full max-w-5xl text-center fade-in border-t-4 border-main">

        // CHUYỂN HƯỚNG SANG FILE STUDENT.HTML
        async function handlePlayCode() {
            let code = document.getElementById('play-code-input')?.value.trim().toUpperCase(); 
            if(!code) return showToast("Nhập mã đề thi!", true);
            
            let btn = document.getElementById('btn-play-code');
            btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> ĐANG KIỂM TRA...'; 
            btn.disabled=true;
            
            try {
                // Chỉ kiểm tra mã có tồn tại không trước khi redirect
                let snap = await db.collection("SharedGames").doc(code).get(); 
                if(!snap.exists) throw new Error("Mã đề thi sai hoặc đã bị xóa!");
                
                let settings = snap.data().settings || {};
                if(settings.openTime && new Date() < new Date(settings.openTime)) throw new Error("Chưa đến giờ mở đề thi này!");
                if(settings.closeTime && new Date() > new Date(settings.closeTime)) throw new Error("Đề thi này đã đóng!");
                
                // Mã hợp lệ, chuyển hướng sang phân hệ học sinh kèm parameter
                showToast("Mã hợp lệ, đang chuyển hướng...");
                setTimeout(() => {
                    window.location.href = `student.html?code=${code}`;
                }, 800);

            } catch(e) { 
                showToast(e.message, true); 
                btn.innerHTML='<i class="fa-solid fa-play mr-2"></i> VÀO THI NGAY'; 
                btn.disabled=false; 
            }
        }

        let currentLookupScope = 'personal';
        function setLookupScope(scope) {
            currentLookupScope = scope;
            let btns = ['personal', 'class', 'grade', 'school'];
            btns.forEach(b => {
                let el = document.getElementById('btn-scope-' + b);
                if(b === scope) { el.classList.add('bg-amber-500', 'text-white', 'shadow'); el.classList.remove('bg-slate-100', 'text-slate-600'); }

            else if(scope === 'grade') { inp.placeholder = "Nhập Khối (vd: 12)..."; inp.value = ""; }

        async function performLookup() {
            let val = document.getElementById('lookup-input').value.trim();
            if(currentLookupScope !== 'school' && !val) return showToast("Vui lòng nhập thông tin tra cứu!", true);
            let btn = document.getElementById('btn-lookup'); let oldHtml = btn.innerHTML; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Đang tìm...'; btn.disabled = true;
            try {
                let res = await fetch(GOOGLE_WEB_APP_URL + "?action=getResults&t=" + Date.now()); 
                let allResults = JSON.parse(await res.text()); 
                let filtered = [];
                if(currentLookupScope === 'personal') { filtered = allResults.filter(r => String(r.id).trim().toLowerCase() === val.toLowerCase()); }
                else if(currentLookupScope === 'class') { filtered = allResults.filter(r => String(r.cls || r.class).trim().toLowerCase() === val.toLowerCase()); }
                else if(currentLookupScope === 'grade') { filtered = allResults.filter(r => String(r.khoi || r.grade).trim() === val); }
                else if(currentLookupScope === 'school') { filtered = allResults; }
                
                if (filtered.length === 0) { showToast("Không tìm thấy kết quả nào!", true); } 
                else { closeLookupModal(); renderGroupResultsModal(filtered, currentLookupScope, val); }
            } catch(e) { showToast("Lỗi tải dữ liệu", true); } 
            finally { btn.innerHTML = oldHtml; btn.disabled = false; }
        }

        let currentGroupResultsData = [];
        let currentGroupTitle = '';
        function renderGroupResultsModal(rawResults, scope, val) { 
            let title = '';
            if(scope === 'personal') title = `Học sinh: ${rawResults[0].name !== 'Khách' && rawResults[0].name ? rawResults[0].name : 'ID ' + val}`;
            else if(scope === 'class') title = `Kết quả Lớp: ${val}`;
            else if(scope === 'grade') title = `Kết quả Khối: ${val}`;
            else if(scope === 'school') title = `Kết quả Toàn trường`;
            
            document.getElementById('personal-results-name').innerText = title;
            currentGroupTitle = title;
            let isPersonal = (scope === 'personal');
            
            let groupedData = {};
            rawResults.forEach(r => {
                let code = String(r.code).trim().toUpperCase(); 
                let sId = String(r.id).trim().toLowerCase();
                let key = isPersonal ? code : `${sId}_${code}`;
                
                let currentScore = Number(r.score) || 0;
                if (!groupedData[key]) { groupedData[key] = { ...r, attempts: 1, maxScore: currentScore }; } 
                else { 
                    groupedData[key].attempts++; 
                    if (currentScore > groupedData[key].maxScore) { 
                        groupedData[key].maxScore = currentScore; 
                        groupedData[key].scoreR1 = r.scoreR1 !== undefined ? r.scoreR1 : r.r1; 
                        groupedData[key].scoreR2 = r.scoreR2 !== undefined ? r.scoreR2 : r.r2; 
                        groupedData[key].scoreR3 = r.scoreR3 !== undefined ? r.scoreR3 : r.r3; 
                        groupedData[key].date = r.date; 
                    } 
                }
            });
            let finalResults = Object.values(groupedData);
            finalResults.sort((a,b) => b.maxScore - a.maxScore);
            currentGroupResultsData = finalResults;
            
            let thHtml = '';
            if(isPersonal) {
                thHtml = `<th class="p-4 text-center">Ngày Thi</th><th class="p-4 text-center">Mã Đề</th><th class="p-4 text-center">Lần</th>`;
            } else {
                thHtml = `<th class="p-4 text-left">Họ Tên</th><th class="p-4 text-center">Lớp</th><th class="p-4 text-center">Mã Đề</th>`;
            }
            
            document.getElementById('personal-results-thead').innerHTML = `<tr class="bg-gradient-to-r from-slate-800 to-slate-700 text-white font-bold text-[10px] md:text-xs uppercase tracking-wider sticky top-0 shadow-md z-10">${thHtml}<th class="p-4 text-center text-sky-300">Phần 1</th><th class="p-4 text-center text-amber-300">Phần 2</th><th class="p-4 text-center text-red-300">Phần 3</th><th class="p-4 text-center text-emerald-300">Tổng</th></tr>`;

            document.getElementById('personal-results-tbody').innerHTML = finalResults.map((r) => {
                let tdHtml = '';
                if(isPersonal) {
                    tdHtml = `<td class="p-3 text-center text-slate-600">${r.date || '-'}</td><td class="p-3 text-center font-bold text-indigo-600 bg-indigo-50/50">${r.code}</td><td class="p-3 text-center font-bold text-rose-500">${r.attempts} lần</td>`;
                } else {
                    tdHtml = `<td class="p-3 text-left font-bold text-slate-700 whitespace-nowrap">${r.name || r.id}</td><td class="p-3 text-center font-bold text-slate-500">${r.cls || r.class || '-'}</td><td class="p-3 text-center font-bold text-indigo-600 bg-indigo-50/50">${r.code}</td>`;
                }
                return `<tr class="text-sm border-t hover:bg-slate-50 transition">${tdHtml}<td class="p-3 text-center text-sky-600 font-medium">${(r.scoreR1 !== undefined ? r.scoreR1 : '-')}</td><td class="p-3 text-center text-amber-600 font-medium">${(r.scoreR2 !== undefined ? r.scoreR2 : '-')}</td><td class="p-3 text-center text-red-600 font-medium">${(r.scoreR3 !== undefined ? r.scoreR3 : '-')}</td><td class="p-3 text-center font-black text-xl text-emerald-600 bg-emerald-50/50">${r.maxScore}</td></tr>`;
            }).join(''); 
            document.getElementById('personal-results-modal').classList.remove('hidden'); 
        }

        function exportGroupCSV() {
            if(currentGroupResultsData.length === 0) return;
            let isPersonal = (currentLookupScope === 'personal');
            let csvContent = "";
            if(isPersonal) {
                csvContent = "\\uFEFFNgày Thi,Mã Đề,Lần,Phần 1,Phần 2,Phần 3,Tổng Điểm\\n";
                currentGroupResultsData.forEach(r => {
                    let r1 = r.scoreR1 !== undefined ? r.scoreR1 : '-'; let r2 = r.scoreR2 !== undefined ? r.scoreR2 : '-'; let r3 = r.scoreR3 !== undefined ? r.scoreR3 : '-';
                    csvContent += `"${r.date || '-'}","${r.code}","${r.attempts}","${r1}","${r2}","${r3}","${r.maxScore}"\\n`;
                });
            } else {
                csvContent = "\\uFEFFHọ Tên,Lớp,Mã Đề,Ngày Thi,Lần,Phần 1,Phần 2,Phần 3,Tổng Điểm\\n";
                currentGroupResultsData.forEach(r => {
                    let r1 = r.scoreR1 !== undefined ? r.scoreR1 : '-'; let r2 = r.scoreR2 !== undefined ? r.scoreR2 : '-'; let r3 = r.scoreR3 !== undefined ? r.scoreR3 : '-';
                    csvContent += `"${r.name || r.id}","${r.cls || r.class || '-'}","${r.code}","${r.date || '-'}","${r.attempts}","${r1}","${r2}","${r3}","${r.maxScore}"\\n`;
                });
            }
            
            let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            let link = document.createElement("a");
            if (link.download !== undefined) {
                let url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `BangDiem_${currentGroupTitle.replace(/\\s+/g, '_')}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        function openLeaderboardModal() { document.getElementById('leaderboard-modal').classList.remove('hidden'); fetchLeaderboard(); }
        async function fetchLeaderboard() {
            let list = document.getElementById('leaderboard-list');
            document.getElementById('leaderboard-loading').classList.remove('hidden');
            try {
                let res = await fetch(GOOGLE_WEB_APP_URL + "?action=getResults&t=" + Date.now()); 
                state.allResultsData = JSON.parse(await res.text());
                document.getElementById('leaderboard-loading').classList.add('hidden');
                
                let filteredData = state.allResultsData;
                let now = new Date();
                if(currentLbFilter === 'week') {
                    let weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                    filteredData = state.allResultsData.filter(r => {
                        if(!r.date) return false;
                        let parts = r.date.split(' ')[0].split('/'); // assuming dd/mm/yyyy
                        if(parts.length < 3) return false;
                        let d = new Date(parts[2], parts[1]-1, parts[0]);
                        return d >= weekAgo;
                    });
                } else if(currentLbFilter === 'month') {
                    let monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                    filteredData = state.allResultsData.filter(r => {
                        if(!r.date) return false;
                        let parts = r.date.split(' ')[0].split('/');
                        if(parts.length < 3) return false;
                        let d = new Date(parts[2], parts[1]-1, parts[0]);
                        return d >= monthAgo;
                    });
                }
                
                // Group by ID to only show best score per student
                let grouped = {};
                filteredData.forEach(r => {
                    let sId = String(r.id).trim().toLowerCase();
                    let currentScore = Number(r.score) || 0;
                    if(!grouped[sId] || currentScore > grouped[sId].score) {
                        grouped[sId] = { ...r, score: currentScore };
                    }
                });
                
                let uniqueData = Object.values(grouped);
                if(uniqueData.length === 0) { list.innerHTML = '<div class="text-center py-8 text-slate-500 font-bold"><i class="fa-solid fa-ghost text-4xl mb-3 opacity-50 block"></i>Chưa có dữ liệu xếp hạng</div>'; return; }
                
                let sorted = uniqueData.sort((a,b) => b.score - a.score).slice(0, 10);
                
                list.innerHTML = sorted.map((hs, i) => {
                    let rankStyle = '';
                    let rankIcon = '';
                    if(i === 0) { rankStyle = 'bg-gradient-to-r from-yellow-200 to-amber-300 border-yellow-400 shadow-[0_0_15px_rgba(250,204,21,0.5)] transform scale-105 z-10 relative'; rankIcon = '<i class="fa-solid fa-medal text-yellow-600 text-2xl drop-shadow-md"></i>'; }
                    else if(i === 1) { rankStyle = 'bg-gradient-to-r from-slate-200 to-slate-300 border-slate-400 shadow-md'; rankIcon = '<i class="fa-solid fa-medal text-slate-500 text-xl"></i>'; }
                    else if(i === 2) { rankStyle = 'bg-gradient-to-r from-orange-200 to-orange-300 border-orange-400 shadow-md'; rankIcon = '<i class="fa-solid fa-medal text-orange-700 text-xl"></i>'; }
                    else { rankStyle = 'bg-white border-slate-200 hover:bg-slate-50'; rankIcon = `<span class="font-black text-slate-400">${i+1}</span>`; }
                    
                    return `
                    <div class="flex items-center p-3 md:p-4 rounded-xl mb-3 border transition-all duration-300 hover:shadow-lg ${rankStyle}">
                        <div class="w-10 flex justify-center items-center shrink-0">${rankIcon}</div>
                        <div class="flex-grow pl-3 border-l border-white/50">
                            <div class="font-bold text-slate-800 text-base md:text-lg uppercase">${hs.name !== 'Khách' && hs.name ? hs.name : 'ID ' + hs.id}</div>
                            <div class="text-[11px] md:text-xs text-slate-500 font-medium mt-0.5"><span class="bg-white/60 px-2 py-0.5 rounded-md">Lớp: ${hs.cls || hs.class || '-'}</span> <span class="bg-white/60 px-2 py-0.5 rounded-md ml-1">Mã đề: ${hs.code}</span></div>
                        </div>
                        <div class="font-black text-emerald-600 text-xl md:text-2xl drop-shadow-sm bg-white/70 px-3 py-1 rounded-lg border border-white shrink-0">${hs.score}</div>
                    </div>`;
                }).join('');
            } catch(e) {
                document.getElementById('leaderboard-loading').classList.add('hidden');
                list.innerHTML = '<div class="text-center py-4 text-red-500 font-bold">Lỗi tải dữ liệu Google Sheet</div>';
            }
        }

                                <div class="bg-white p-8 md:p-10 rounded-3xl shadow-lg border-2 border-slate-100 relative h-full">
                                    <div class="absolute top-0 right-0 bg-main text-white px-6 py-2 rounded-bl-3xl rounded-tr-3xl font-black text-sm uppercase tracking-widest shadow-md">Tin Tuần / Tháng</div>
                                    <div class="prose prose-slate prose-lg max-w-none text-slate-700 font-medium leading-relaxed math-scroll min-h-[400px]">
                                        ${processedContent}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                if(window.MathJax) MathJax.typesetPromise();
            } catch(e) {
                appContent.innerHTML = "<div class='text-center text-red-400 py-10'><i class='fa-solid fa-triangle-exclamation text-5xl mb-3'></i><br>Lỗi kết nối khi tải bảng tin.</div>";
            }
        }

        async function openBoardEditor() {
            try {
                let doc = await db.collection("GameData").doc("BoardInfo").get();
                let content = doc.exists ? doc.data().content : "";
                document.getElementById('board-edit-content').value = content;
                document.getElementById('board-edit-modal').classList.remove('hidden');
                document.getElementById('board-edit-modal').classList.add('flex');
            } catch(e) {
                showToast("Lỗi tải nội dung", true);
            }
        }

        async function saveBoardContent() {
            let content = document.getElementById('board-edit-content').value;
            try {
                await db.collection("GameData").doc("BoardInfo").set({ content: content });
                document.getElementById('board-edit-modal').classList.add('hidden');
                document.getElementById('board-edit-modal').classList.remove('flex');
                showToast("Đã lưu bảng tin!");
                renderBoard(); // Reload the board
            } catch(e) {
                showToast("Lỗi khi lưu bảng tin", true);
            }
        }

        // ======================= LIÊN KẾT & HƯỚNG DẪN =======================
        function renderLinks() {
            let linksHtml = savedLinks.length ? savedLinks.map(l => `<a href="${l.url}" target="_blank" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4 hover:border-main transition group"><div class="w-12 h-12 bg-sky-100 text-sky-600 rounded-xl flex items-center justify-center text-xl group-hover:scale-110 transition"><i class="fa-solid fa-link"></i></div><div class="truncate"><h4 class="font-bold text-slate-800 group-hover:text-main">${l.title}</h4><p class="text-xs text-slate-500">${l.url}</p></div></a>`).join('') : '<div class="col-span-full text-center py-10 text-slate-400 font-medium">Chưa có liên kết nào.</div>';
            document.getElementById('app-content').innerHTML = `<div class="glass-panel p-8 md:p-12 rounded-3xl w-full max-w-5xl text-center fade-in border-t-4 border-sky-500"><h2 class="text-3xl font-black text-sky-900 mb-8 uppercase tracking-wider"><i class="fa-solid fa-link text-sky-500 mr-3"></i>Danh Bạ Liên Kết</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 text-left">${linksHtml}</div></div>`;
        }

        function renderGuide() {
            document.getElementById('app-content').innerHTML = `
                <div class="glass-panel p-6 md:p-8 rounded-3xl w-full max-w-6xl text-left fade-in border-t-4 border-emerald-500 flex flex-col md:flex-row gap-6">
                    <div class="w-full md:w-1/3 flex flex-col gap-3">
                        <h2 class="text-2xl font-black text-slate-800 mb-2 uppercase tracking-widest border-b-2 border-slate-200 pb-3"><i class="fa-solid fa-book-open text-emerald-500 mr-3"></i>Hướng Dẫn</h2>
                        <button onclick="showGuideTab('student')" id="guide-tab-student" class="guide-tab active-guide-tab px-5 py-4 rounded-2xl font-bold text-left transition flex items-center justify-between"><span class="flex items-center gap-3"><i class="fa-solid fa-graduation-cap text-xl"></i> Dành cho Học sinh</span><i class="fa-solid fa-chevron-right"></i></button>
                        <button onclick="showGuideTab('teacher')" id="guide-tab-teacher" class="guide-tab px-5 py-4 rounded-2xl font-bold text-left transition flex items-center justify-between"><span class="flex items-center gap-3"><i class="fa-solid fa-chalkboard-user text-xl"></i> Dành cho Giáo viên</span><i class="fa-solid fa-chevron-right"></i></button>
                        <button onclick="showGuideTab('admin')" id="guide-tab-admin" class="guide-tab px-5 py-4 rounded-2xl font-bold text-left transition flex items-center justify-between"><span class="flex items-center gap-3"><i class="fa-solid fa-user-shield text-xl"></i> Quản trị viên</span><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    <div class="w-full md:w-2/3 bg-white/60 p-6 md:p-8 rounded-3xl border border-slate-200 shadow-inner h-[600px] overflow-y-auto admin-scroll" id="guide-content-area">
                    </div>
                </div>
            `;
            showGuideTab('student');
        }

        window.showGuideTab = function(tab) {
            document.querySelectorAll('.guide-tab').forEach(el => {
                el.classList.remove('bg-emerald-500', 'text-white', 'shadow-md');
                el.classList.add('bg-slate-50', 'text-slate-600', 'hover:bg-slate-100');
            });
            let active = document.getElementById('guide-tab-' + tab);
            active.classList.remove('bg-slate-50', 'text-slate-600', 'hover:bg-slate-100');
            active.classList.add('bg-emerald-500', 'text-white', 'shadow-md');

            let content = '';
            if (tab === 'student') {
                content = `
                    <h3 class="text-2xl font-black text-emerald-700 mb-6">Hướng dẫn dành cho Học sinh</h3>
                    
                    <div class="space-y-6">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-emerald-400">
                            <h4 class="font-bold text-lg text-slate-800 mb-2"><i class="fa-solid fa-right-to-bracket text-emerald-500 mr-2"></i>1. Đăng nhập và Bắt đầu thi</h4>
                            <p class="text-slate-600 mb-2">Để bắt đầu làm bài, bạn cần có <b>Mã Đề Thi</b> do giáo viên cung cấp. Nhập mã này tại trang chủ và nhấn <b>VÀO THI NGAY</b>.</p>
                            <p class="text-slate-600">Tiếp theo, nhập <b>Mã ID Học sinh</b> và <b>Mật khẩu</b> cá nhân. Nếu là lần đầu tiên đăng nhập với mật khẩu mặc định (123456), hệ thống sẽ yêu cầu bạn đổi mật khẩu mới để bảo mật bài thi.</p>
                        </div>
                        
                        <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-amber-400">
                            <h4 class="font-bold text-lg text-slate-800 mb-2"><i class="fa-solid fa-shield-halved text-amber-500 mr-2"></i>2. Quy chế thi (Anti-cheat)</h4>
                            <p class="text-slate-600">Trong chế độ <b>Thi nghiêm túc</b>, hệ thống sẽ theo dõi các hành vi chuyển tab, thu nhỏ trình duyệt, hoặc mở ứng dụng khác. Nếu bạn vi phạm quá 3 lần, bài thi sẽ tự động bị nộp.</p>
                        </div>
                        
                        <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-sky-400">
                            <h4 class="font-bold text-lg text-slate-800 mb-2"><i class="fa-solid fa-keyboard text-sky-500 mr-2"></i>3. Gõ công thức Toán học</h4>
                            <p class="text-slate-600 mb-2">Đối với các câu hỏi Điền khuyết (Phần 3), bạn có thể sử dụng bàn phím Toán học tích hợp để nhập phân số, căn bậc hai, luỹ thừa,... một cách dễ dàng.</p>
                            <p class="text-slate-600">Bạn cũng có thể mở bảng nháp (Bảng trắng) tại biểu tượng góc trên bên phải để vẽ hình hoặc tính toán nháp.</p>
                        </div>
                    </div>
                `;
            } else if (tab === 'teacher') {
                content = `
                    <h3 class="text-2xl font-black text-indigo-700 mb-6">Hướng dẫn dành cho Giáo viên</h3>
                    
                    <div class="space-y-6">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-indigo-400">
                            <h4 class="font-bold text-lg text-slate-800 mb-2"><i class="fa-solid fa-wand-magic-sparkles text-indigo-500 mr-2"></i>1. Sinh đề tự động bằng AI</h4>
                            <p class="text-slate-600">Tại trang Quản trị, giáo viên có thể dán nội dung văn bản đề thi thô hoặc ảnh chụp đề thi. AI (Gemini) sẽ tự động nhận diện, bóc tách và định dạng lại thành cấu trúc JSON chuẩn của hệ thống cho cả 3 phần thi.</p>
                        </div>

                        <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-teal-400">
                            <h4 class="font-bold text-lg text-slate-800 mb-2"><i class="fa-solid fa-cubes text-teal-500 mr-2"></i>2. Trộn đề từ Ngân hàng (Ma trận)</h4>
                            <p class="text-slate-600 mb-2">Tính năng <b>Ngân Hàng/Ma Trận</b> cho phép giáo viên thiết lập cấu trúc đề thi (ví dụ: 5 câu Nhận biết Khảo sát hàm số, 3 câu Thông hiểu Hình Oxyz). Hệ thống sẽ tự động bốc ngẫu nhiên các câu hỏi thỏa mãn từ Ngân hàng để tạo thành đề thi mới.</p>
                        </div>
                        
                        <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-orange-400">
                            <h4 class="font-bold text-lg text-slate-800 mb-2"><i class="fa-solid fa-chart-simple text-orange-500 mr-2"></i>3. Tra cứu và Trích xuất điểm</h4>
                            <p class="text-slate-600">Tại tab <b>Quản Lý Điểm</b>, giáo viên có thể xem chi tiết điểm số của học sinh theo từng phần thi. Hỗ trợ lọc theo Lớp, Khối và cho phép xuất (Export CSV) báo cáo ra định dạng file Excel để thống kê.</p>
                        </div>
                    </div>
                `;
            } else if (tab === 'admin') {
                content = `
                    <h3 class="text-2xl font-black text-rose-700 mb-6">Khu vực Quản trị (Super Admin)</h3>
                    
                    <div class="space-y-6">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-rose-400">
                            <h4 class="font-bold text-lg text-slate-800 mb-2"><i class="fa-solid fa-user-shield text-rose-500 mr-2"></i>1. Phân quyền Giáo viên</h4>
                            <p class="text-slate-600">Super Admin (người có quyền cao nhất) có thể cấp quyền truy cập hệ thống Quản trị cho các giáo viên khác thông qua tính năng <b>Phân Quyền</b>. Chỉ những email được cấp quyền mới có thể xem và sửa đề thi.</p>
                        </div>

                        <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-violet-400">
                            <h4 class="font-bold text-lg text-slate-800 mb-2"><i class="fa-solid fa-users text-violet-500 mr-2"></i>2. Quản lý Học sinh</h4>
                            <p class="text-slate-600">Tại tab <b>Học Sinh</b>, quản trị viên có thể quản lý danh sách thí sinh dự thi. Tính năng <b>Import Nhanh</b> cho phép sao chép dữ liệu từ Excel (ID, Họ Tên, Lớp) và dán trực tiếp để tạo hàng loạt tài khoản. Mật khẩu khởi tạo sẽ mặc định là 123456.</p>
                        </div>
                    </div>
                `;
            }
            document.getElementById('guide-content-area').innerHTML = `<div class="fade-in">${content}</div>`;
        }
    </script>
</body>
</html>
